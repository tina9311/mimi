body {

.button:hover {

iframe {

.heart-card {
  background-color: #FFECEC;
  width: 500px;
  margin-top: 20px;
  margin-bottom: 20px;
  padding: 15px;
  border: 3px solid #FF8CBA;
  border-radius: 20px;
  text-align: center;
}

.heart-card h2 {
  margin-top: 0;
  color: #D63384;
}

.heart-button {
  padding: 10px 25px;
  background-color: #FFB6C1;
  color: white;
  border: none;
  border-radius: 20px;
  font-size: 20px;
  cursor: pointer;
  font-family: '標楷體', sans-serif;
}

.heart-button:hover {
  background-color: #FF69B4;
}

#heartBox {
  font-size: 28px;
  min-height: 30px;
  margin: 15px 0 0 0;
  padding: 0;
  line-height: 1.2;
}

.clear-button {
  padding: 10px 25px;
  background-color: #BEBEBE;
  color: white;
  border: none;
  border-radius: 20px;
  font-size: 20px;
  cursor: pointer;
  font-family: '標楷體', sans-serif;
  margin-left: 10px;
}

.clear-button:hover {
  background-color: #7B7B7B;
}

.photo-wall {
  width: 800px;
  background-color: #FFF4C1;
  border: 3px solid	#FFDC35;
  border-radius: 20px;
  padding: 20px;
  margin-top: 50px;
  margin-bottom: 40px;
  overflow: hidden;
  text-align: center;
}

.photo-wall h2 {
  margin-top: 0;
  color: #FF9224;
}

.photo-track {
  display: flex;
  gap: 20px;
  animation: movePhotos 15s linear infinite;
}

.photo-track img {
  width: 180px;
  height: 180px;
  object-fit: cover;
  border-radius: 20px;
  border: 3px solid white;
}

@keyframes movePhotos {
  from {
    transform: translateX(50px);
  }

  to {
    transform: translateX(-1000px);
  }
}

.photo-wall:hover .photo-track {
  animation-play-state: paused;
}

.song-card h2 {
  margin-top: 0;
  color: #5151A2;
}

.song-card {
  background-color: #E6E6F2;
  width: 700px;
  padding: 20px;
  border: 3px solid #A6A6D2;
  border-radius: 20px;
  text-align: center;
  margin: 30px auto;
}

.song-card img {
  width: 100%;
  border-radius: 15px;
}

.song-card h3 {
  color: #5B5B5B;
}
</style>
